# Projeto Supabase do T3 Just (DC5): criar em sa-east-1 (São Paulo, PT-16) e ligar com
# `supabase link --project-ref <ref>`. Um projeto por ambiente: desenvolvimento, teste e
# produção (PT-14). Migrations em supabase/migrations, aplicadas em ordem.
project_id = "t3just"

[db]
major_version = 17

[api]
# Os apps nunca usam a API REST das tabelas: nem a chave de serviço lê tabela (0002). Só as
# Edge Functions, chamando funções do banco.
schemas = ["public"]

# As funções não usam o JWT do Supabase na entrada: só aceitam o segredo de repasse (F0.8).
[functions.api-portal]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.api-console]
verify_jwt = false
import_map = "./functions/deno.json"

# Login (F0.6, PT-08). Ninguém se cadastra sozinho: a equipe T3 Just cria o escritório e
# convida o sócio (passo 1).
[auth]
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
# E-mail verificado antes de entrar.
enable_confirmations = true
# Troca de e-mail confirmada nos dois endereços: o anterior fica sabendo (PT-08).
double_confirm_changes = true
# Trocar a senha logado pede reautenticação recente.
secure_password_change = true
# Link de recuperação vale 1 hora e é de uso único; um pedido novo invalida o anterior.
otp_expiry = 3600
max_frequency = "60s"

# Autenticador (TOTP): obrigatório para a equipe no Console; opcional para o sócio.
[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Sessão de até 12 h; 2 h parada encerra.
[auth.sessions]
timebox = "12h"
inactivity_timeout = "2h"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

# Segredos das funções (supabase secrets set ...): REPASSE_SEGREDO (o mesmo dos apps, 32+
# caracteres), PORTAL_URL e CONSOLE_URL (para o link de redefinir senha).
# SUPABASE_URL, SUPABASE_ANON_KEY e SUPABASE_SERVICE_ROLE_KEY o Supabase já entrega.
# O modelo do e-mail de recuperação leva ao app com o token:
# {{ .RedirectTo }}?token_hash={{ .TokenHash }}
# O modelo do e-mail de convite (passo 1) segue a mesma forma e leva a /criar-senha do app
# de destino (PORTAL_URL para o sócio e a equipe do escritório, CONSOLE_URL para a equipe T3 Just).
