# Projeto Supabase do T3jus (DC5): criar em sa-east-1 (São Paulo, PT-16) e ligar com
# `supabase link --project-ref <ref>`. Um projeto por ambiente: desenvolvimento, teste e
# produção (PT-14). Migrations em supabase/migrations, aplicadas em ordem.
project_id = "t3jus"

[db]
major_version = 17

[api]
# Os apps nunca usam a API REST das tabelas: nem a chave de serviço lê tabela (0002). Só as
# Edge Functions, chamando funções do banco.
schemas = ["public"]

# As funções não usam o JWT do Supabase na entrada: só aceitam o segredo de repasse (F0.8).
[functions.api-portal]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.api-console]
verify_jwt = false
import_map = "./functions/deno.json"

# Contrato e documentos do cliente no Console (CO-05): bucket privado, sem acesso público e
# sem política para usuário; só a Edge Function, com a chave de serviço, assina envio e leitura.
[storage]
file_size_limit = "10MiB"

[storage.buckets.documentos-console]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

# Documentos dos casos no Portal (EX-05): outro bucket privado, separado dos anexos do Console,
# porque são dados do escritório. Também só a Edge Function assina envio e leitura.
[storage.buckets.documentos-portal]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

# Login (F0.6, PT-08). Ninguém se cadastra sozinho: a equipe T3jus cria o escritório e
# convida o sócio (passo 1).
[auth]
enable_signup = false
# Regras da senha (tela aprovada): 12 caracteres ou mais e fora das listas de senhas vazadas
# (conferida pela API antes de salvar). Sem exigir maiúscula, número ou símbolo, como
# recomenda o NIST SP 800-63B: a tela mostra só as duas regras.
minimum_password_length = 12
password_requirements = ""
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
# E-mail verificado antes de entrar.
enable_confirmations = true
# Troca de e-mail confirmada nos dois endereços: o anterior fica sabendo (PT-08).
double_confirm_changes = true
# Trocar a senha logado pede reautenticação recente.
secure_password_change = true
# Link de recuperação e convite valem 1 hora (decisão da Carol, 18/11) e são de uso único; um pedido novo invalida o anterior.
otp_expiry = 3600
max_frequency = "60s"

# E-mails do login saem pelo Resend (domínio t3jus.pro verificado em São Paulo), como
# "T3jus <nao-responda@t3jus.pro>". A senha do SMTP é a chave da API do Resend: localmente vem
# de RESEND_API_KEY; no projeto hospedado, a Carol cola no painel (Authentication > Emails >
# SMTP Settings). Passo a passo em docs/EMAILS.md. Aqui fica desligado para o ambiente local não
# mandar e-mail de verdade (os e-mails param na caixa de teste do Supabase local); ligar só para
# testar o Resend de propósito.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "nao-responda@t3jus.pro"
sender_name = "T3jus"

# Modelos em português (docs/EMAILS.md). O link é sempre {{ .RedirectTo }}?token_hash={{ .TokenHash }}.
[auth.email.template.invite]
subject = "Seu convite para o T3jus"
content_path = "./supabase/templates/convite.html"

[auth.email.template.recovery]
subject = "Crie uma nova senha no T3jus"
content_path = "./supabase/templates/nova-senha.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no T3jus"
content_path = "./supabase/templates/link-de-acesso.html"

# Autenticador (TOTP): obrigatório para a equipe no Console; opcional para o sócio.
[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Sessão de até 12 h; 2 h parada encerra.
[auth.sessions]
timebox = "12h"
inactivity_timeout = "2h"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

# Segredos das funções (supabase secrets set ...): REPASSE_SEGREDO (o mesmo dos apps, 32+
# caracteres), PORTAL_URL e CONSOLE_URL (para o link de redefinir senha).
# OPENAI_API_KEY (a IA que atende pelo WhatsApp; sem ela, a conversa vai para a equipe) e,
# se quiser trocar o modelo, IA_MODELO (padrão gpt-4.1-mini).
# SUPABASE_URL, SUPABASE_ANON_KEY e SUPABASE_SERVICE_ROLE_KEY o Supabase já entrega.
# No Console (Vercel), ARQUIVOS_ORIGEM é a origem do Supabase (https://<ref>.supabase.co): entra
# no connect-src da CSP para o navegador mandar o anexo direto ao Storage.
# O modelo do e-mail de recuperação leva ao app com o token:
# {{ .RedirectTo }}?token_hash={{ .TokenHash }}
# O modelo do e-mail de convite (passo 1) segue a mesma forma e leva a /criar-senha do app
# de destino (PORTAL_URL para o sócio e a equipe do escritório, CONSOLE_URL para a equipe T3jus).
# O modelo do link de acesso (Magic Link) usa a mesma forma: {{ .RedirectTo }}?token_hash={{ .TokenHash }}.
# O RedirectTo é /entrar/link (manter conectado) ou /entrar/link/sessao (até fechar o navegador).
# Os dois endereços de cada app entram na lista de redirecionamentos permitidos do Auth.
